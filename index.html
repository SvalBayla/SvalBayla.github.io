<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sval Bayla's website</title>
    <link rel="shortcut icon" href="/o_o.png" type="image/png">
    <style>
        /* Base Styles */
        html {
            font-family: 'Courier New', Courier, monospace; /* Ensures cross-browser monospace */
            color: #FF46A2;
            background-color: black;
            padding: 2rem;
        }

        a {
            color: #46FFA3;
            text-decoration: none;
            border-bottom: 1px dashed #46FFA3;
        }
        
        a:hover {
            background-color: #46FFA3;
            color: black;
        }

        /* Layout limits to keep it readable */
        body {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Form Styling */
        form {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Space between elements */
        }

        textarea {
            background-color: rgba(255, 70, 162, 0.1); /* Very subtle pink tint */
            border: 2px solid #FF46A2;
            color: #46FFA3; /* Typing in green */
            font-family: inherit;
            font-size: 1rem;
            padding: 1rem;
            min-height: 150px;
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't break width */
            resize: vertical; /* Allows resizing height but not width */
            outline: none;
        }

        textarea:focus {
            border-color: #46FFA3; /* Border turns green on click */
            box-shadow: 0 0 10px rgba(70, 255, 163, 0.2);
        }

        /* Placeholder text color */
        textarea::placeholder {
            color: rgba(255, 70, 162, 0.5);
            font-style: italic;
        }

        button {
            background-color: transparent;
            color: #FF46A2;
            border: 2px solid #FF46A2;
            padding: 0.8rem 2rem;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            align-self: flex-start; /* Keeps button left-aligned */
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #FF46A2;
            color: black;
            box-shadow: 4px 4px 0px #46FFA3; /* Retro shadow effect */
            transform: translate(-2px, -2px);
        }
    </style>
</head>
<body>
    <h1>Sval Bayla's website</h1>
    <p>idk how you're here yet but gimme a bit I'm working on this</p>
    <p>in the meantime, feel free to send me a message:</p>
    
    <form action="https://formspree.io/f/maqnrarq" method="POST">
        <textarea name="message" placeholder="Type your signal here..."></textarea>
        <button type="submit">>> Send Transmission</button>
    </form>
</body>
</html>
