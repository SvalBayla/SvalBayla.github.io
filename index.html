<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sval Bayla's website</title>
    <link rel="shortcut icon" href="/o_o.png" type="image/png">
    <style>
        /* --- ANIMATION KEYFRAMES --- */
        
        /* Simulates the screen flickering */
        @keyframes flicker {
            0% { opacity: 0.99; text-shadow: 0 0 4px #FF46A2; }
            5% { opacity: 0.85; text-shadow: 0 0 1px #FF46A2; }
            10% { opacity: 0.99; text-shadow: 0 0 4px #FF46A2; }
            100% { opacity: 0.99; text-shadow: 0 0 4px #FF46A2; }
        }

        /* Simulates a blinking cursor */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Simulates terminal text loading in */
        @keyframes loadIn {
            from { 
                opacity: 0; 
                transform: translateY(10px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        /* Base Styles */
        html {
            font-family: 'Courier New', Courier, monospace;
            color: #FF46A2;
            background-color: black;
            padding: 2rem;
            height: 100%;
            box-sizing: border-box;
            /* Global Text Glow for that CRT feel */
            text-shadow: 0 0 2px rgba(255, 70, 162, 0.5); 
            overflow-x: hidden;
        }

        /* CRT SCANLINE OVERLAY */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 2px, 6px 100%; /* Horizontal lines + slight vertical separation */
            z-index: 999; /* On top of everything */
            pointer-events: none; /* Allows you to click through the lines */
        }

        a {
            color: #46FFA3;
            text-decoration: none;
            border-bottom: 1px dashed #46FFA3;
            transition: 0.3s;
            text-shadow: 0 0 2px rgba(70, 255, 163, 0.5);
        }
        
        a:hover {
            background-color: #46FFA3;
            color: black;
            box-shadow: 0 0 10px #46FFA3;
        }

        body {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        /* --- APPLYING ANIMATIONS --- */

        /* Header Effect */
        h1 {
            animation: flicker 4s infinite alternate;
            position: relative;
            display: inline-block;
        }

        /* The Blinking Cursor Block */
        h1::after {
            content: '█'; /* Block cursor character */
            color: #46FFA3;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        /* Staggered Load-in for content */
        p, form {
            opacity: 0; /* Hidden initially */
            animation: loadIn 0.5s ease-out forwards;
        }

        /* Delays so they appear one by one */
        p:nth-of-type(1) { animation-delay: 0.2s; }
        p:nth-of-type(2) { animation-delay: 0.8s; }
        form { animation-delay: 1.2s; }

        /* Form Styling */
        form {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            background-color: rgba(255, 70, 162, 0.05);
            border: 2px solid #FF46A2;
            color: #46FFA3;
            font-family: inherit;
            font-size: 1rem;
            padding: 1rem;
            min-height: 150px;
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(255, 70, 162, 0.2);
        }

        textarea:focus {
            border-color: #46FFA3;
            /* Green glow on focus */
            box-shadow: 0 0 15px rgba(70, 255, 163, 0.4), inset 0 0 10px rgba(70, 255, 163, 0.1); 
        }

        textarea::placeholder {
            color: rgba(255, 70, 162, 0.4);
            font-style: italic;
        }

        button {
            background-color: transparent;
            color: #FF46A2;
            border: 2px solid #FF46A2;
            padding: 0.8rem 2rem;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            align-self: flex-start;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background-color: #FF46A2;
            color: black;
            box-shadow: 4px 4px 0px #46FFA3; 
            transform: translate(-2px, -2px);
            text-shadow: none;
        }
        
        /* Button active state (click) */
        button:active {
            transform: translate(0px, 0px);
            box-shadow: 2px 2px 0px #46FFA3;
        }
    </style>
</head>
<body>
    <div class="terminal-content">
        <h1>Sval Bayla's website</h1>
        <p>idk how you're here yet but gimme a bit I'm working on this</p>
        <p>in the meantime, feel free to send me a message:</p>
        
        <form action="https://formspree.io/f/maqnrarq" method="POST">
            <textarea name="message" placeholder="Type your message here..."></textarea>
            <button type="submit">>> Send Transmission</button>
        </form>
    </div>
</body>
</html>
